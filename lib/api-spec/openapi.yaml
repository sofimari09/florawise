openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: FloraWise plant care management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: dashboard
  - name: species
  - name: plants
  - name: tasks
  - name: reminders
  - name: weather
  - name: recommendations
  - name: analytics
  - name: reports
paths:
  /storage/uploads/request-url:
    post:
      operationId: requestPhotoUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhotoUploadInput" }
      responses:
        "200":
          description: Приватне пряме завантаження, URL чинний 15 хвилин
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoUpload" }
        "400": { description: Некоректний тип або розмір фото }
        "401": { description: Потрібен вхід через Clerk }
        "503": { description: Сховище тимчасово недоступне }
  /storage/uploads/complete:
    post:
      operationId: completePhotoUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhotoObjectInput" }
      responses:
        "200":
          description: Фото перевірено та збережено приватно
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhotoObjectInput" }
        "400": { description: Некоректний файл }
        "401": { description: Потрібен вхід }
        "404": { description: Фото не знайдено або належить іншому користувачу }
        "503": { description: Сховище тимчасово недоступне }
  /storage/objects/photos/{id}:
    get:
      operationId: getPrivatePhoto
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Приватне фото власника, без кешування
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "401": { description: Потрібен вхід }
        "404": { description: Фото не знайдено або належить іншому користувачу }
        "503": { description: Сховище тимчасово недоступне }
  /places:
    get:
      operationId: listPlantPlaces
      responses:
        "200":
          description: Місця користувача
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PlantPlace" } }
    post:
      operationId: createPlantPlace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlantPlaceInput" }
      responses:
        "201":
          description: Місце збережено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlantPlace" }
  /places/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updatePlantPlace
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlantPlaceInput" }
      responses:
        "200":
          description: Місце оновлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlantPlace" }
    delete:
      operationId: deletePlantPlace
      responses:
        "204": { description: Місце видалено }
  /locations:
    get:
      operationId: listSavedLocations
      responses:
        "200":
          description: Збережені погодні локації
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SavedLocation" } }
    post:
      operationId: createSavedLocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedLocationInput" }
      responses:
        "201":
          description: Локацію збережено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedLocation" }
  /locations/search:
    get:
      operationId: searchLocations
      parameters:
        - { name: q, in: query, required: true, schema: { type: string, minLength: 3 } }
      responses:
        "200":
          description: Результати пошуку населених пунктів
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/LocationSuggestion" } }
  /locations/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    patch:
      operationId: updateSavedLocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedLocationUpdate" }
      responses:
        "200":
          description: Локацію оновлено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedLocation" }
    delete:
      operationId: deleteSavedLocation
      responses:
        "204": { description: Локацію видалено }
  /species/{id}/knowledge:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getSpeciesKnowledge
      responses:
        "200":
          description: Правила та джерела знань
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpeciesKnowledge" }
    put:
      operationId: updateSpeciesKnowledge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SpeciesKnowledgeInput" }
      responses:
        "200":
          description: Знання збережено
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SpeciesKnowledge" }
  /plants/{id}/care-plan:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: previewCarePlan
      responses:
        "200":
          description: Пропозиції без створення завдань
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CarePlanItem" } }
    post:
      operationId: confirmCarePlan
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CarePlanInput" }
      responses:
        "201":
          description: Створено лише підтверджені завдання
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/CareTask" } }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    patch:
      operationId: updateCurrentUser
      tags: [auth]
      summary: Update current user's weather location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileWeatherLocationInput"
      responses:
        "200":
          description: Updated current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /dashboard:
    get:
      operationId: getDashboard
      tags: [dashboard]
      summary: Get dashboard overview
      parameters:
        - name: weatherScenario
          in: query
          schema:
            type: string
            enum: [RAIN_TOMORROW]
          description: Development-only deterministic forecast fixture.
      responses:
        "200":
          description: Dashboard overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
  /species:
    get:
      operationId: listSpecies
      tags: [species]
      summary: List plant species
      parameters:
        - $ref: "#/components/parameters/Search"
        - { name: category, in: query, schema: { $ref: "#/components/schemas/PlantCategory" } }
      responses:
        "200":
          description: Species
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlantSpecies"
    post:
      operationId: createSpecies
      tags: [species]
      summary: Create plant species
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeciesInput"
      responses:
        "201":
          description: Created species
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantSpecies"
  /species/{id}:
    patch:
      operationId: updateSpecies
      tags: [species]
      summary: Update plant species
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpeciesInput"
      responses:
        "200":
          description: Updated species
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantSpecies"
    delete:
      operationId: deleteSpecies
      tags: [species]
      summary: Delete plant species
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /plants:
    get:
      operationId: listPlants
      tags: [plants]
      summary: List owned plants
      parameters:
        - $ref: "#/components/parameters/Search"
        - { name: category, in: query, schema: { $ref: "#/components/schemas/PlantCategory" } }
        - name: speciesId
          in: query
          schema:
            type: [integer, "null"]
        - name: location
          in: query
          schema:
            type: [string, "null"]
        - name: overdue
          in: query
          schema:
            type: boolean
        - name: highPriority
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Plants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plant"
    post:
      operationId: createPlant
      tags: [plants]
      summary: Add plant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantInput"
      responses:
        "201":
          description: Created plant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
  /plants/{id}:
    get:
      operationId: getPlant
      tags: [plants]
      summary: Get plant details
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Plant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantDetail"
    patch:
      operationId: updatePlant
      tags: [plants]
      summary: Update plant
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantUpdate"
      responses:
        "200":
          description: Updated plant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
    delete:
      operationId: deletePlant
      tags: [plants]
      summary: Delete plant
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
  /tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List care tasks
      parameters:
        - { name: type, in: query, schema: { $ref: "#/components/schemas/CareType" } }
        - name: from
          in: query
          schema:
            type: [string, "null"]
        - name: to
          in: query
          schema:
            type: [string, "null"]
        - name: status
          in: query
          schema:
            type: [string, "null"]
        - name: plantId
          in: query
          schema:
            type: [integer, "null"]
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareTask"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Schedule care task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskInput"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTask"
  /tasks/{id}:
    patch:
      operationId: updateTask
      tags: [tasks]
      summary: Update care task
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskUpdate"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTask"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Cancel care task
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Cancelled
  /tasks/{id}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Complete care task
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionInput"
      responses:
        "200":
          description: Completed task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTask"
  /reminders:
    get:
      operationId: listReminders
      tags: [reminders]
      summary: List active reminders
      responses:
        "200":
          description: Reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
  /reminders/{id}:
    patch:
      operationId: updateReminder
      tags: [reminders]
      summary: Update reminder status
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderUpdate"
      responses:
        "200":
          description: Updated reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /weather:
    get:
      operationId: getWeather
      tags: [weather]
      summary: Get seven day forecast
      parameters:
        - name: weatherScenario
          in: query
          schema:
            type: string
            enum: [RAIN_TOMORROW]
          description: Development-only deterministic forecast fixture.
      responses:
        "200":
          description: Forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherResponse"
  /recommendations:
    get:
      operationId: listRecommendations
      tags: [recommendations]
      summary: List stored recommendations
      parameters:
        - name: plantId
          in: query
          schema:
            type: [integer, "null"]
        - name: priority
          in: query
          schema:
            type: [string, "null"]
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Recommendation"
    post:
      operationId: generateRecommendation
      tags: [recommendations]
      summary: Generate rule based recommendation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationInput"
      responses:
        "201":
          description: Generated recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResult"
  /recommendations/{id}/apply:
    post:
      operationId: applyRecommendation
      tags: [recommendations]
      summary: Apply suggested schedule change
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Applied recommendation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CareTask"
  /recommendations/{id}/refresh:
    post:
      operationId: refreshRecommendation
      tags: [recommendations]
      summary: Refresh a stale weather recommendation using the current forecast
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationRefreshInput"
      responses:
        "200":
          description: Updated recommendation or explanation that no new rescheduling advice is needed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResult"
        "409":
          description: Task or recommendation is no longer refreshable
        "503":
          description: Current weather provider is unavailable; old recommendation remains unchanged
  /history:
    get:
      operationId: listCareHistory
      tags: [analytics]
      summary: List completed care history
      parameters:
        - name: plantId
          in: query
          schema:
            type: [integer, "null"]
        - name: taskType
          in: query
          schema:
            type: [string, "null"]
        - name: from
          in: query
          schema:
            type: [string, "null"]
        - name: to
          in: query
          schema:
            type: [string, "null"]
      responses:
        "200":
          description: Completed care history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CareHistory"
  /statistics:
    get:
      operationId: getStatistics
      tags: [analytics]
      summary: Get care statistics
      parameters:
        - name: from
          in: query
          schema:
            type: [string, "null"]
        - name: to
          in: query
          schema:
            type: [string, "null"]
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statistics"
  /reports:
    get:
      operationId: listReports
      tags: [reports]
      summary: List generated reports
      responses:
        "200":
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
    post:
      operationId: createReport
      tags: [reports]
      summary: Generate care report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "201":
          description: Generated report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Report"
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    Search:
      name: search
      in: query
      schema:
        type: [string, "null"]
  schemas:
    PlantPlace:
      allOf:
        - $ref: "#/components/schemas/PlantPlaceInput"
      properties:
        id: { type: integer }
      required: [id]
    PlantPlaceInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        environmentType: { type: string, enum: [INDOOR, BALCONY, OUTDOOR, GREENHOUSE] }
      required: [name, environmentType]
    LocationSuggestion:
      type: object
      properties:
        displayName: { type: string }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
      required: [displayName, latitude, longitude]
    SavedLocationInput:
      allOf:
        - $ref: "#/components/schemas/LocationSuggestion"
      properties:
        isDefault: { type: boolean }
    SavedLocation:
      allOf:
        - $ref: "#/components/schemas/SavedLocationInput"
      properties:
        id: { type: integer }
        lastUsedAt: { type: string }
      required: [id, isDefault, lastUsedAt]
    SavedLocationUpdate:
      type: object
      properties:
        displayName: { type: string, minLength: 1 }
        isDefault: { type: boolean }
    PlantCategory:
      type: string
      enum: [INDOOR_DECORATIVE, OUTDOOR_DECORATIVE, FRUIT_TREE, BERRY_SHRUB, VEGETABLE, HERB]
    CareType:
      type: string
      enum: [WATERING, FERTILIZING, PRUNING, TRANSPLANTING, TREATMENT, HARVEST, SOWING, PLANTING]
    SpeciesCareRule:
      type: object
      properties:
        careType: { $ref: "#/components/schemas/CareType" }
        ruleCode: { type: [string, "null"] }
        triggerDescription: { type: [string, "null"] }
        recommendedAction: { type: [string, "null"] }
        intervalDaysMin: { type: [integer, "null"], minimum: 1 }
        intervalDaysMax: { type: [integer, "null"], minimum: 1 }
        targetWaterMmWeekMin: { type: [number, "null"], minimum: 0 }
        targetWaterMmWeekMax: { type: [number, "null"], minimum: 0 }
        sourceCodes: { type: array, items: { type: string } }
        rainThresholdMm: { type: [number, "null"], minimum: 0 }
        maxWindSpeedMps: { type: [number, "null"], minimum: 0 }
        minTemperature: { type: [number, "null"] }
        maxTemperature: { type: [number, "null"] }
        notes: { type: [string, "null"] }
      required: [careType, ruleCode, triggerDescription, recommendedAction, intervalDaysMin, intervalDaysMax, targetWaterMmWeekMin, targetWaterMmWeekMax, sourceCodes, rainThresholdMm, maxWindSpeedMps, minTemperature, maxTemperature, notes]
    KnowledgeSource:
      type: object
      properties:
        sourceCode: { type: [string, "null"] }
        sourceName: { type: string, minLength: 1 }
        organization: { type: [string, "null"] }
        subject: { type: [string, "null"] }
        sourceUrl: { type: [string, "null"] }
        retrievedAt: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        citation: { type: [string, "null"] }
      required: [sourceCode, sourceName, organization, subject, sourceUrl, retrievedAt, notes, citation]
    SpeciesKnowledgeInput:
      type: object
      properties:
        careRules: { type: array, items: { $ref: "#/components/schemas/SpeciesCareRule" } }
        sources: { type: array, items: { $ref: "#/components/schemas/KnowledgeSource" } }
      required: [careRules, sources]
    SpeciesKnowledge:
      allOf:
        - $ref: "#/components/schemas/SpeciesKnowledgeInput"
    CarePlanItem:
      type: object
      properties:
        type: { $ref: "#/components/schemas/CareType" }
        eligibilityVersion: { type: string }
        scheduledDate: { type: string }
        reason: { type: string }
      required: [type, scheduledDate, reason, eligibilityVersion]
    CarePlanInput:
      type: object
      properties:
        items: { type: array, maxItems: 10, items: { $ref: "#/components/schemas/CarePlanItem" } }
      required: [items]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]
    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        role: { type: string, enum: [USER, ADMIN] }
        weatherLocationName: { type: string }
        weatherLatitude: { type: [number, "null"] }
        weatherLongitude: { type: [number, "null"] }
      required: [id, username, email, role, weatherLocationName, weatherLatitude, weatherLongitude]
    ProfileWeatherLocationInput:
      type: object
      properties:
        weatherLocationName: { type: string, minLength: 1 }
        weatherLatitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        weatherLongitude: { type: [number, "null"], minimum: -180, maximum: 180 }
      required: [weatherLocationName, weatherLatitude, weatherLongitude]
    PlantSpecies:
      type: object
      properties:
        id: { type: integer }
        speciesCode: { type: [string, "null"] }
        name: { type: string }
        scientificName: { type: [string, "null"] }
        lifeCycle: { type: [string, "null"] }
        category: { $ref: "#/components/schemas/PlantCategory" }
        applicableCareTypes:
          type: [array, "null"]
          description: "Null inherits category defaults; an explicit empty array disables all activities."
          uniqueItems: true
          items: { $ref: "#/components/schemas/CareType" }
        allowedCareTypes:
          type: array
          readOnly: true
